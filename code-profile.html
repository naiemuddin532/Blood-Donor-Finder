<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Blood Donor Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="protected">
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <h1>My profile</h1>
        <p>View, edit or delete your account. Every role has this page.</p>
      </div>
    </div>

    <div class="profile-grid">

      <!-- left: photo + short info -->
      <div class="card profile-side">
        <div class="profile-photo" id="photo"></div>
        <h2 id="sideName"></h2>
        <p><span class="chip chip-blue" id="sideRole"></span></p>
        <p class="muted" id="sideSince" style="margin:10px 0"></p>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
        <button type="button" class="btn small light" id="photoBtn">Change photo</button>
        <div class="info">
          <p id="sideEmail"></p>
          <p id="sideArea"></p>
        </div>
      </div>

      <div class="profile-right">

        <!-- personal information -->
        <form class="card" id="infoForm" novalidate>
          <h3>Personal information</h3>
          <div id="msg" class="msg"></div>
          <div class="row-2">
            <div class="form-group"><label for="name">Full name</label><input type="text" id="name"></div>
            <div class="form-group"><label for="email">Email address</label><input type="email" id="email"></div>
            <div class="form-group"><label for="phone">Phone number</label><input type="text" id="phone"></div>
            <div class="form-group" id="hospitalGroup"><label for="hospital">Hospital / blood bank</label><input type="text" id="hospital"></div>
            <div class="form-group" id="areaGroup"><label for="area">Area</label><select id="area"></select></div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn">Save changes</button>
            <button type="button" class="btn light" id="cancelEdit">Cancel</button>
          </div>
        </form>

        <div class="bottom-two">
          <!-- change password -->
          <form class="card" id="passForm" novalidate>
            <h3>Change password</h3>
            <div id="passMsg" class="msg"></div>
            <div class="form-group"><label for="oldPass">Current password</label><input type="password" id="oldPass"></div>
            <div class="form-group"><label for="newPass">New password</label><input type="password" id="newPass" placeholder="At least 8 characters"></div>
            <button type="submit" class="btn">Update password</button>
          </form>

          <!-- delete account -->
          <div class="card">
            <h3 class="danger-title">Delete account</h3>
            <p class="muted" style="margin-bottom:14px">This permanently removes your profile and request history. This cannot be undone.</p>
            <button type="button" class="btn danger-btn" id="deleteBtn">Delete my account</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Blood Donor Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="reset-body">
  <div class="reset-box">
    <div class="logo-dark">&#129656; Blood Donor Finder</div>
    <h1>Reset your password</h1>
    <p>Verify your account, then choose a new password.</p>

    <div id="msg" class="msg"></div>

    <div class="steps">
      <!-- step 1 -->
      <form class="step active" id="verifyForm" novalidate>
        <h3><span>1</span> Verify your account</h3>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="karim@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="text" id="phone" placeholder="01700000000">
        </div>
        <button type="submit" class="btn full">Verify and continue</button>
      </form>

      <!-- step 2 -->
      <form class="step" id="newPassForm" novalidate>
        <h3><span>2</span> Set a new password</h3>
        <div class="form-group">
          <label for="newPass">New password</label>
          <input type="password" id="newPass" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label for="confirmPass">Confirm new password</label>
          <input type="password" id="confirmPass" placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn light full">Save new password</button>
      </form>
    </div>

    <a class="back" href="login.html">Back to login</a>
  </div>

  <script src="js/common.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>

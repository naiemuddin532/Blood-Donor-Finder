<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices | Blood Donor Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="protected">
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <h1>Notices</h1>
        <p>Publish announcements for users.</p>
      </div>
    </div>

    <div class="report-grid">
      <form class="card" id="noticeForm" novalidate>
        <h3>New notice</h3>
        <div id="msg" class="msg"></div>
        <div class="form-group"><label for="title">Title</label><input type="text" id="title" placeholder="Blood donation camp this Friday"></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" rows="4" placeholder="Write the announcement..."></textarea></div>
        <div class="form-group">
          <label for="audience">Audience</label>
          <select id="audience">
            <option value="all">All users</option>
            <option value="donor">Donors</option>
            <option value="recipient">Recipients</option>
            <option value="staff">Blood bank staff</option>
          </select>
        </div>
        <button type="submit" class="btn">&#128226; Publish notice</button>
      </form>

      <div class="card">
        <h3>Published notices</h3>
        <div id="noticeList"></div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/admin-notices.js"></script>
</body>
</html>
